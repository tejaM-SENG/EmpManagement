{% extends "empmngt/navbar.html" %}
{% block nav_block %}
<section class='container my-5'>
<h1 class='text-center fw-bold mt-5'>Update Employee Form</h1>
<div class='contanier mt-5 mb-2'>
        <form method="POST" class='mt-3 pe-5'>
            {% csrf_token %}
            Name <input type='text' name='Name' value='{{d.Name}}' class='form-control'><br>
            Employee ID <input type='text' name='Emp_ID' value='{{d.Emp_ID}}' class='form-control'><br>
            Date Of Joining <input type='date' name='Date_of_Joining' value='{{ d.Date_of_Joining|date:'Y-m-d'}}' class='form-control'><br>
            Designation <input type='text' name='Designation' value='{{d.Designation}}' class='form-control'><br>
            Department <input type='text' name='Department' value='{{d.Department}}' class='form-control'><br>
            Annual CTC <input type='text' name='Annual_CTC' value='{{d.Annual_CTC}}' class='form-control'><br>
            Experience <input type='text' name='Experience' value='{{d.Experience}}' class='form-control'><br>
            <a href='/viewemp/'><input type="submit" class="btn btn-primary my-3 mx-auto d-block" value="Submit"></a>
        </form>
    </div>
</section>
{% endblock %}
