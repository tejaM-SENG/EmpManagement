{% extends "empmngt/navbar.html" %}
{% block nav_block %}
<section class='container my-5'>
<h1 class='text-center fw-bold mt-5'>Employee Form</h1>
<div class='contanier mt-5 mb-2'>
        <form method="POST" class='mt-3 pe-5'>
            {% csrf_token %}
            {% for i in form %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">{{ i.label }}</label><br>
                    {{ i }}
                </div>
            {% endfor %}
            <input type="submit" class="btn btn-primary my-3 mx-auto d-block" value="Submit">
        </form>
</div>
</section>
{% endblock %}
